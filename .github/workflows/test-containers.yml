# Scans the app images that app-build pushed to dev ECR. If Trivy finds a
# critical vulnerability with a fix available, Renovate opens a PR to update
# the Dockerfile base images (same approach as bcgov/CONN-CCBC-portal).
#
# Required GitHub configuration:
#   dev environment: secret AWS_DEPLOY_ROLE_ARN, variable LICENSE_PLATE
#   repository secret: RENOVATE_GITHUB_TOKEN

name: test-containers

on:
  workflow_run:
    workflows:
      - app-build
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: test-containers
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  trivy-scan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 60
    outputs:
      results-length: ${{ steps.scan-results-length.outputs.results-length }}

    env:
      LICENSE_PLATE: ${{ vars.LICENSE_PLATE }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-test-containers-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # branch=master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.LICENSE_PLATE }}-dev-app-backend:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-backend.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          timeout: 10m0s

      - name: Trivy scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # branch=master
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.LICENSE_PLATE }}-dev-app-frontend:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-frontend.sarif
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          timeout: 10m0s

      - name: Upload backend scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Upload frontend scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Get results length from SARIF
        id: scan-results-length
        run: |
          backend=$(jq '.runs[0].results | length' trivy-backend.sarif)
          frontend=$(jq '.runs[0].results | length' trivy-frontend.sarif)
          echo "results-length=$((backend + frontend))" >> "${GITHUB_OUTPUT}"

  renovate:
    needs: trivy-scan
    if: needs.trivy-scan.outputs.results-length > 0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # tag=v46.3.8
        with:
          configurationFile: ./.github/renovate.json
          token: ${{ secrets.RENOVATE_GITHUB_TOKEN }}

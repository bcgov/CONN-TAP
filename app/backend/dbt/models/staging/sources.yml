version: 2

sources:
  - name: app
    schema: app
    tables:
      - name: datasets
  - name: reference_data
    schema: reference_data
    tables:
      - name: sector
      - name: bge
      - name: sub_bge
        columns:
          - name: code
            tests:
              - relationships:
                  to: ref('sub_bge_alias_map')
                  field: sub_bge_alias
      - name: provider
      - name: service_category
      - name: service_sub_category
      - name: service_code
  - name: raw_data
    schema: raw_data
    tables:
      - name: ingestion_run
      - name: raw_telus_spend
      - name: raw_rogers_spend_cellular
      - name: raw_rogers_spend_data_voice
      - name: tsma_ingestion_run
      - name: tsma_wireless
      - name: tsma_lite_wireless
      - name: tsma_wireline
      - name: tsma_lite_wireline
      - name: tsma_ivr
      - name: tsma_mms
      - name: tsma_other_ingestion_run
      - name: tsma_other_managed_security
      - name: tsma_other_managed_router
      - name: raw_rogers_v2_cellular_pricebook
      - name: raw_rogers_v2_cellular_device_pricebook
      - name: raw_rogers_v2_data_pricebook
      - name: raw_rogers_v2_voice_pricebook
      - name: raw_rogers_v2_professional_services_pricebook
      - name: raw_telus_v2_data_services_pricebook
      - name: raw_telus_v2_voice_services_pricebook
      - name: raw_telus_v2_voice_data_usage_rates_pricebook
      - name: raw_telus_v2_cellular_services_pricebook
      - name: raw_telus_v2_cellular_additional_fee_based_features_pricebook
      - name: raw_telus_v2_cellular_mms_pricebook
      - name: raw_telus_v2_control_center_pricebook
      - name: raw_telus_v2_gms_pricebook
      - name: raw_telus_v2_fleet_complete_pricebook
      - name: raw_telus_v2_connected_worker_pricebook
      - name: raw_telus_v2_connected_worker_usage_rate_pricebook
      - name: raw_telus_v2_connected_worker_hardware_pricebook
      - name: raw_telus_v2_tls_pricebook
        columns:
          # the pricebook tab; stg_telus_pricebook_services maps each one to a TLS sub-category
          - name: product
            tests:
              - accepted_values:
                  values: ['SIPA V1', 'Analog Private Line', 'Centrex', 'Carrier Optical Ethernet',
                           'Managed Router', 'Copper Services', 'ADSL Services', 'IP Trunking R2']
      - name: raw_telus_v2_professional_services_pricebook
      - name: raw_telus_v2_connected_worker_professional_services_pricebook

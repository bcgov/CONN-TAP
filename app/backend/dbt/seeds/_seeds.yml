version: 2

seeds:
  - name: telus_tls_charge_descriptions
    description: >
      TELUS bill charge descriptions that belong to Time Limited Services (the analysts'
      LTO list), with the TLS sub-category each one falls under.
    columns:
      - name: charge_description
        tests:
          # a repeated description would double the bill lines it matches
          - unique
      - name: sub_category_code
        tests:
          - not_null
          - relationships:
              to: source('reference_data', 'service_sub_category')
              field: code

  - name: bge_alias_map
    description: Maps raw organization name spellings/variants to a canonical BGE code.
    columns:
      - name: bge_alias
        tests:
          # Every alias must resolve to a real BGE code -- except 'ECC'. Reports label
          # Education & Child Care at BGE level, but our system has no ECC BGE:
          # int_service_spend_line_items remaps 'ECC' to the Gov BC BGE + the
          # Education and Child Care sub_bge, so the alias is intentionally unresolved here.
          - relationships:
              to: source('reference_data', 'bge')
              field: code
              config:
                where: "bge_alias <> 'ECC'"

  - name: sub_bge_alias_map
    description: Maps raw sub-organization name spellings/variants to a canonical sub_bge code.
    columns:
      # Integrity runs the other way: reference_data.sub_bge asserts every code has
      # an alias here (see sources.yml). We intentionally do NOT require every alias
      # to resolve to a sub_bge — aliases are maintained from the list, not provider
      # data, so an alias for a not-yet-loaded / retired entity is allowed.
      - name: sub_bge_alias
        description: >
          Canonical sub_bge code this raw spelling resolves to. May also be a BGE code
          (e.g. 'PHSA', 'BC Hydro', 'VCHA (+PHC)') when the account is the organisation
          itself: that spend is then booked directly under the BGE with no sub_bge
          (see int_service_spend_line_items). Point an alias at a sub_bge only when the
          account belongs to that sub-organisation.

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

migrate:
  enabled: false
  # Migrations and dbt run as the owner user; the app connects as tap_api / tap_web.
  postgresUser: "dbadmin"
  # Secret with POSTGRES_PASSWORD (owner) and TAP_API_POSTGRES_PASSWORD /
  # TAP_WEB_POSTGRES_PASSWORD (set by the deploy workflows).
  existingSecret: ""

backend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources: {}
  podAnnotations: {}
  env:
    POSTGRES_HOST: ""
    POSTGRES_PORT: "5432"
    POSTGRES_USER: "tap_api"
    POSTGRES_DB: "app"
    POSTGRES_SSL: "true"
    CORS_ORIGINS: '["http://localhost:3000"]'
    SESSION_COOKIE_NAME: "telecom_session"
  existingSecret: ""
  secretEnv: {}

frontend:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources: {}
  podAnnotations: {}
  env:
    APP_BASE_URL: ""
    BACKEND_INTERNAL_URL: "http://conn-tap-backend:8000"
    ENTRA_TENANT_ID: ""
    ENTRA_CLIENT_ID: ""
    SESSION_COOKIE_NAME: "telecom_session"
    POSTGRES_HOST: ""
    POSTGRES_PORT: "5432"
    POSTGRES_USER: "tap_web"
    POSTGRES_DB: "app"
    POSTGRES_SSL: "true"
  existingSecret: ""
  secretEnv: {}

# LZA Pattern A: internal ALB via AWS Load Balancer Controller. Deploy workflow sets
# host and annotations; must share ingress group with bcgovhealthcheck (Terraform).
ingress:
  enabled: false
  className: alb
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: []
